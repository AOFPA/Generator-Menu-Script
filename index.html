<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Menu Script </title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background: #f3f6fb;
      min-height: 100vh;
    }
    .btn-primary {
      background: #2563eb;
      transition: all 0.2s ease-in-out;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .input-box {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-box:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      outline: none;
    }
    .icon-preview {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: contain;
      background: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 lg:p-10">
  <main class="mx-auto w-full max-w-7xl">
    <header class="mb-6">
      <div class="flex flex-wrap items-center gap-3">
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-blue-600">FocusOne DevTools</p>
        <span id="appVersion" class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-blue-700">V1.2.0</span>
      </div>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">Generator Menu Script</h1>
      <p class="mt-1 text-sm text-slate-500">กรอกข้อมูลเมนู แล้วสร้าง SQL script พร้อมคัดลอกไปใช้งาน</p>
    </header>
    <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
        <div class="mb-6"><h2 class="text-lg font-semibold text-slate-900">Menu details</h2><p class="mt-1 text-sm text-slate-500">ระบุข้อมูลที่ต้องการบันทึกในระบบ</p></div>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="text-gray-600 text-sm">Table Name</label>
        <input id="tableName" type="text" value="ACCFIN_MENU_ITEM" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">SID</label>
        <input id="sid" type="text" value="555" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">xType</label>
        <input id="xType" type="text" value="Application" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Header ID</label>
        <input id="headerId" type="text" value="BETA_PROGRAM_VERSION" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Menu ID</label>
        <input id="menuId" type="text" value="BG_T100N1" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Index</label>
        <input id="index" type="number" value="2" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Menu Title</label>
        <input id="menuTitle" type="text" value="BG-T100N1 Budgeting Plan Master Request" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Menu Subtitle</label>
        <input id="menuSubtitle" type="text" value="คำขอแผนงบประมาณ" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div>
        <label class="text-gray-600 text-sm">Navigate URL</label>
        <input id="url" type="text" value="/BRM/Budget/EBudget.aspx" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

      <div class="flex items-end gap-3">
        <div class="flex-1">
          <label class="text-gray-600 text-sm">Icon URL</label>
          <input id="icon" type="text" value="https://focusone-documents.s3.ap-southeast-1.amazonaws.com/f1erp_web_icon/item/icon_master.svg" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
        </div>
        <img id="iconPreview" src="https://focusone-documents.s3.ap-southeast-1.amazonaws.com/f1erp_web_icon/item/icon_master.svg" class="icon-preview" alt="icon">
      </div>

      <div>
        <label class="text-gray-600 text-sm">Web ID</label>
        <input id="webId" type="text" value="ACCOUTING_FINANCIAL_SYSTEM" class="w-full mt-1 p-2.5 rounded-lg border border-gray-300 input-box" />
      </div>

        </div>
        <div class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-[1fr_auto]">
          <button id="generate" class="btn-primary rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-sm">สร้าง SQL Script <span aria-hidden="true">→</span></button>
          <button id="resetForm" type="button" class="rounded-xl border border-slate-300 px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">คืนค่าเริ่มต้น</button>
        </div>
      </section>
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6">
          <div><h2 class="font-semibold text-slate-900">SQL Preview</h2><p class="mt-0.5 text-xs text-slate-500">กดสร้าง SQL เพื่ออัปเดตผลลัพธ์</p></div>
          <div class="flex items-center gap-2">
            <button id="exportTxt" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Export TXT</button>
            <button id="copy" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50">คัดลอก</button>
          </div>
        </div>
        <pre id="output" aria-label="SQL Preview" class="min-h-[28rem] max-h-[70vh] overflow-auto bg-slate-950 p-5 font-mono text-xs leading-6 text-slate-100 sm:text-sm"><code id="outputCode" class="whitespace-pre"></code></pre>
        <p id="copyStatus" role="status" aria-live="polite" class="min-h-10 px-5 py-2 text-sm text-slate-500 sm:px-6">พร้อมคัดลอก SQL</p>
      </section>
    </div>
    <footer class="py-6 text-center text-xs text-slate-400">© 2025 FocusOne DevTools — Aof</footer>
  </main>

  <script>
    const formFieldIds = ["tableName", "sid", "xType", "headerId", "menuId", "index", "menuTitle", "menuSubtitle", "url", "icon", "webId"];
    const storageKey = "generatorMenuScript.formValues";

    function updateIconPreview() {
      const iconUrl = $("#icon").val().trim();
      $("#iconPreview").attr("src", iconUrl || "");
    }

    function saveFormValues() {
      const values = Object.fromEntries(formFieldIds.map(id => [id, $(`#${id}`).val()]));
      try {
        localStorage.setItem(storageKey, JSON.stringify(values));
      } catch (error) {
        console.warn("Unable to save form values in this browser.", error);
      }
    }

    function restoreFormValues() {
      try {
        const savedValues = JSON.parse(localStorage.getItem(storageKey) || "{}");
        formFieldIds.forEach(id => {
          if (typeof savedValues[id] === "string") $(`#${id}`).val(savedValues[id]);
        });
      } catch (error) {
        console.warn("Unable to restore saved form values.", error);
      }
      updateIconPreview();
    }

    formFieldIds.forEach(id => $(`#${id}`).on("input change", saveFormValues));
    $("#icon").on("input", updateIconPreview);
    restoreFormValues();

    $("#resetForm").click(() => {
      formFieldIds.forEach(id => {
        const field = document.getElementById(id);
        $(`#${id}`).val(field.defaultValue);
      });
      updateIconPreview();
      saveFormValues();
      Swal.fire({ toast: true, position: "top-end", icon: "success", title: "คืนค่าเริ่มต้นแล้ว", showConfirmButton: false, timer: 1800, timerProgressBar: true });
    });

    let generatedSql = "";

    const appVersion = "V1.2.0";
    const versionStorageKey = "generatorMenuScript.lastSeenVersion";
    const releaseNotes = [
      { type: "Feature", text: "เพิ่ม Menu Subtitle พร้อมค่าเริ่มต้นภาษาไทย" },
      { type: "Feature", text: "ปรับหน้าจอและ SQL Preview ให้อ่านง่าย พร้อมคัดลอก SQL" },
      { type: "Feature", text: "แจ้งเตือนเมื่อสร้างหรือคัดลอก SQL สำเร็จ" },
      { type: "Feature", text: "จำค่าฟอร์ม ตรวจสอบข้อมูล และคืนค่าเริ่มต้นได้" },
      { type: "Fix", text: "Escape อัญประกาศเดี่ยวในข้อความก่อนนำไปสร้าง SQL" },
      { type: "Feature", text: "Export SQL Preview เป็นไฟล์ TXT โดยตั้งชื่อไฟล์จาก Table Name และวันที่" }
    ];

    $("#appVersion").text(appVersion);

    async function showReleaseNotesIfNeeded() {
      try {
        if (localStorage.getItem(versionStorageKey) === appVersion) return;

        const notesHtml = releaseNotes.map(note => `
          <li style="margin: 0.5rem 0; text-align: left;">
            <strong style="color: ${note.type === "Fix" ? "#d97706" : "#2563eb"};">${note.type}</strong>
            <span>${note.text}</span>
          </li>`).join("");

        await Swal.fire({
          title: `มีอะไรใหม่ ${appVersion}`,
          html: `<ul style="padding-left: 1.25rem; margin: 0;">${notesHtml}</ul>`,
          confirmButtonText: "เริ่มใช้งาน",
          confirmButtonColor: "#2563eb",
          width: "34rem"
        });

        localStorage.setItem(versionStorageKey, appVersion);
      } catch (error) {
        console.warn("Unable to show or save release notes state.", error);
      }
    }

    showReleaseNotesIfNeeded();

    function formatLocalDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}${month}${day}`;
    }

    function sanitizeFileName(value) {
      return value.trim()
        .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
        .replace(/\s+/g, "_")
        .replace(/[. ]+$/g, "") || "table";
    }

    $("#exportTxt").click(() => {
      if (!generatedSql) {
        Swal.fire({ toast: true, position: "top-end", icon: "warning", title: "กรุณาสร้าง SQL ก่อน Export", showConfirmButton: false, timer: 2200, timerProgressBar: true });
        return;
      }

      const tableName = sanitizeFileName($("#tableName").val());
      const fileName = `S_XXXX_${tableName}_${formatLocalDate(new Date())}.txt`;
      const file = new Blob([generatedSql], { type: "text/plain;charset=utf-8" });
      const downloadUrl = URL.createObjectURL(file);
      const downloadLink = document.createElement("a");
      downloadLink.href = downloadUrl;
      downloadLink.download = fileName;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      downloadLink.remove();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 0);

      Swal.fire({ toast: true, position: "top-end", icon: "success", title: `Export ${fileName} สำเร็จ`, showConfirmButton: false, timer: 2400, timerProgressBar: true });
    });

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function highlightSql(sql) {
      const sqlKeywords = /\b(INSERT INTO|VALUES)\b/gi;
      const sqlColumns = /\b(SID|HeaderID|xType|MenuID|MenuTitle|MenuSubtitle|xIndex|NAVIGATEURL|NAVIGATEIMAGE|Created_on|Created_by|Updated_on|Updated_by|WebID|objectid|objecttype|parentobjectid|CREATED_ON|UPDATED_ON|UPDATED_BY|CREATED_BY|DESCRIPTION|tcode|command|MODULE|NameSpace|DELIMITEDDEBUG|DELIMITEDEXC|DLL|HelpLink|NameSpaceView|ClassView|ApplicationType|profileid|objectvalue|created_on|created_by|updated_on|updated_by)\b/gi;
      const stringLiteral = /(N'(?:''|[^'])*'|'(?:''|[^'])*')/g;

      return sql.split(stringLiteral).map(part => {
        if (/^N?'/.test(part)) return `<span class="text-emerald-300">${escapeHtml(part)}</span>`;
        return escapeHtml(part)
          .replace(sqlKeywords, '<span class="text-sky-400">$1</span>')
          .replace(sqlColumns, '<span class="text-violet-300">$1</span>');
      }).join("");
    }

    function sqlString(value) {
      return value.replace(/'/g, "''");
    }

    // ✅ Generate SQL script
    $("#generate").click(() => {
      const sid = $("#sid").val();
      const headerId = $("#headerId").val();
      const menuId = $("#menuId").val();
      const menuTitle = $("#menuTitle").val();
      const menuSubtitle = $("#menuSubtitle").val();
      const url = $("#url").val();
      const icon = $("#icon").val();
      const webId = $("#webId").val();
      const index = $("#index").val();
      const xType = $("#xType").val();
      const tableName = $("#tableName").val();
      const values = { tableName, sid, xType, headerId, menuId, index, menuTitle, menuSubtitle, url, icon, webId };
      const emptyFields = Object.entries(values).filter(([, value]) => String(value).trim() === "").map(([field]) => field);
      if (emptyFields.length) {
        Swal.fire({ toast: true, position: "top-end", icon: "warning", title: "กรุณากรอกข้อมูลให้ครบทุกช่อง", showConfirmButton: false, timer: 2500, timerProgressBar: true });
        $(`#${emptyFields[0]}`).trigger("focus");
        return;
      }
      const numericIndex = Number(index);
      if (!Number.isSafeInteger(numericIndex) || numericIndex < 0) {
        Swal.fire({ toast: true, position: "top-end", icon: "warning", title: "Index ต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป", showConfirmButton: false, timer: 2500, timerProgressBar: true });
        $("#index").trigger("focus");
        return;
      }
      const q = sqlString;
      const dateNow = new Date().toISOString().slice(0, 10).replace(/-/g, '') + "000000";

      generatedSql = `INSERT INTO ${tableName} (
    SID, HeaderID, xType, MenuID, MenuTitle, MenuSubtitle, xIndex,
    NAVIGATEURL, NAVIGATEIMAGE, Created_on, Created_by,
    Updated_on, Updated_by, WebID
)
VALUES (
    N'${q(sid)}', N'${q(headerId)}', N'${q(xType)}', N'${q(menuId)}',
    N'${q(menuTitle)}', N'${q(menuSubtitle)}', ${numericIndex},
    N'${q(url)}', N'${q(icon)}', N'${dateNow}', N'FOCUSONE',
    N'${dateNow}', N'FOCUSONE', N'${q(webId)}'
);

INSERT INTO auth_mainprogram (
    objectid, objecttype, parentobjectid, SID, CREATED_ON, UPDATED_ON,
    UPDATED_BY, CREATED_BY, DESCRIPTION, tcode, command, MODULE,
    NameSpace, DELIMITEDDEBUG, DELIMITEDEXC, DLL, HelpLink,
    NameSpaceView, ClassView, ApplicationType
)
VALUES
    (N'ACTIVITY', N'S', N'${q(menuId)}', N'${q(sid)}', N'${dateNow}', N'${dateNow}',
     N'FOCUSONE', N'FOCUSONE', N'${q(menuTitle)}', N'', N'', N'', N'', N'',
     N'', N'', N'', N'', N'', N''),
    (N'${q(menuId)}', N'M', N'${q(menuId)}', N'${q(sid)}', N'${dateNow}', N'${dateNow}',
     N'FOCUSONE', N'FOCUSONE', N'${q(menuTitle)}', N'', N'', N'', N'', N'',
     N'', N'', N'', N'', N'', N'');

INSERT INTO auth_profileobject (
    sid, profileid, parentobjectid, objectid, DESCRIPTION, objectvalue,
    objecttype, created_on, created_by, updated_on, updated_by
)
VALUES
    (N'${q(sid)}', N'000001', N'${q(menuId)}', N'ACTIVITY', N'${q(menuTitle)}', N'*',
     N'S', N'${dateNow}', N'FOCUSONE', N'${dateNow}', N'FOCUSONE'),
    (N'${q(sid)}', N'000001', N'${q(menuId)}', N'${q(menuId)}', N'${q(menuTitle)}', N'*',
     N'M', N'${dateNow}', N'FOCUSONE', N'${dateNow}', N'FOCUSONE');`;
      $("#outputCode").html(highlightSql(generatedSql));
      Swal.fire({ toast: true, position: "top-end", icon: "success", title: "สร้าง SQL สำเร็จ", showConfirmButton: false, timer: 1800, timerProgressBar: true });
    });

    // Copy script and show inline feedback
    $("#copy").click(async () => {
      const output = generatedSql;
      const status = $("#copyStatus");
      if (!output) {
        status.text("กรุณาสร้าง SQL ก่อนคัดลอก").removeClass("text-emerald-600").addClass("text-amber-600");
        Swal.fire({ toast: true, position: "top-end", icon: "warning", title: "กรุณาสร้าง SQL ก่อนคัดลอก", showConfirmButton: false, timer: 2200, timerProgressBar: true });
        return;
      }
      try {
        await navigator.clipboard.writeText(output);
        status.text("คัดลอก SQL แล้ว").removeClass("text-amber-600").addClass("text-emerald-600");
        Swal.fire({ toast: true, position: "top-end", icon: "success", title: "คัดลอก SQL แล้ว", showConfirmButton: false, timer: 1800, timerProgressBar: true });
      } catch {
        status.text("คัดลอกไม่สำเร็จ กรุณาอนุญาตการเข้าถึง Clipboard").removeClass("text-emerald-600").addClass("text-amber-600");
        Swal.fire({ toast: true, position: "top-end", icon: "error", title: "คัดลอกไม่สำเร็จ", text: "กรุณาอนุญาตการเข้าถึง Clipboard", showConfirmButton: false, timer: 2800, timerProgressBar: true });
      }
    });
  </script>

</body>
</html>
